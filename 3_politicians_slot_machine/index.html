<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>三巨頭拉罷</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="jquery-1.8.2.min.js"></script>
    <script type="text/javascript">
        // opening the page with this hash shows the three real heads
        var SECRET_HASH = "#jackpot";

        // original: show the three real heads
        // keep: "han", "ko" or "huang" stays a real head, the other two are mixed
        function shuffle(original, keep) {
            console.log("shuffle");
            var DATA = ["han", "ko", "huang"];
            var name = {
                "han": {
                    "top": "韓",
                    "middle": "國",
                    "bottom": "瑜"
                },
                "ko": {
                    "top": "柯",
                    "middle": "文",
                    "bottom": "哲"
                },
                "huang": {
                    "top": "黃",
                    "middle": "國",
                    "bottom": "昌"
                },
            }
            var top = DATA, middle = DATA, bottom = DATA;
            if (keep) {
                // roll again if the other two also came out as real heads
                do {
                    top = shuffleKeeping(DATA, keep);
                    middle = shuffleKeeping(DATA, keep);
                    bottom = shuffleKeeping(DATA, keep);
                } while (top.join() == middle.join() && middle.join() == bottom.join());
            } else if (!original) {
                top = shuffleArr(DATA);
                middle = shuffleArr(DATA);
                bottom = shuffleArr(DATA);
            }

            console.log(top);
            console.log(middle);
            console.log(bottom);

            jQuery(".view .pic div").removeClass("han ko huang")

            // set pic of #firstView
            jQuery("#firstView .top").addClass(top[0]);
            jQuery("#firstView .middle").addClass(middle[0]);
            jQuery("#firstView .bottom").addClass(bottom[0]);
            jQuery("#firstView .name").text(
                  name[top[0]]["top"]
                + name[middle[0]]["middle"]
                + name[bottom[0]]["bottom"]
                );

            // set pic of #secondView
            jQuery("#secondView .top").addClass(top[1]);
            jQuery("#secondView .middle").addClass(middle[1]);
            jQuery("#secondView .bottom").addClass(bottom[1]);
            jQuery("#secondView .name").text(
                  name[top[1]]["top"]
                + name[middle[1]]["middle"]
                + name[bottom[1]]["bottom"]
                );


            // set pic of #thirdView
            jQuery("#thirdView .top").addClass(top[2]);
            jQuery("#thirdView .middle").addClass(middle[2]);
            jQuery("#thirdView .bottom").addClass(bottom[2]);
            jQuery("#thirdView .name").text(
                  name[top[2]]["top"]
                + name[middle[2]]["middle"]
                + name[bottom[2]]["bottom"]
                );

        }

        function shuffleArr(dataArr) {
            var array = dataArr.filter(() => true);
            let currentIndex = array.length;

            // While there remain elements to shuffle...
            while (currentIndex != 0) {

            // Pick a remaining element...
            let randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;

            // And swap it with the current element.
            [array[currentIndex], array[randomIndex]] = [
              array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // keeps `keep` in its own position and shuffles the rest around it
        function shuffleKeeping(dataArr, keep) {
            var rest = shuffleArr(dataArr.filter((item) => item != keep));
            return dataArr.map((item) => item == keep ? keep : rest.pop());
        }


    </script>
    <style type="text/css">
        .name {
            font-size: 30px;
            text-align: center;
        }
        .view {
            width: 234px;
            height: 310px;
            float: left;
        }
        .pic {
            width: 216px;
            height: 260px;
        }

        .pic div {
            width: 216px;
        }

        /* han.png, ko.png and fu.png are aligned by align.py, so the
           same cut lines (110px and 161px) work for every image */
        .pic .top {
            background-position: 0px 0px;
            height: 110px;
        }

        .pic .middle {
            background-position: 0px -110px;
            height: 51px;
        }

        .pic .bottom {
            background-position: 0px -161px;
            height: 99px;
        }

        .pic div.han {
            background-image: url(han.png);
        }

        .pic div.ko {
            background-image: url(ko.png);
        }

        .pic div.huang {
            background-image: url(fu.png);
        }

    </style>
</head>
<body >
    <div id="control" >
        <button onclick="shuffle();">洗牌</button>
        <button onclick="shuffle(false, 'han');">找到韓國瑜</button>
        <button onclick="shuffle(false, 'ko');">找到柯文哲</button>
        <button onclick="shuffle(false, 'huang');">找到黃國昌</button>
    </div>
    <div id="view">
        <div id="firstView" class="view">
                        <div class="name">韓國瑜</div>
                        <div class="pic">
                            <div class="top han"></div>
                            <div class="middle han"></div>
                            <div class="bottom han"></div>
                        </div>
                    </div>
                    <div id="secondView" class="view">
                        <div class="name">柯文哲</div>
                        <div class="pic">
                            <div class="top ko"></div>
                            <div class="middle ko"></div>
                            <div class="bottom ko"></div>
                        </div>
                    </div>
                    <div id="thirdView" class="view">
                        <div class="name">黃國昌</div>
                        <div class="pic">
                            <div class="top huang"></div>
                            <div class="middle huang"></div>
                            <div class="bottom huang"></div>
                        </div>
                    </div>
    </div>
    <script type="text/javascript">
        shuffle(location.hash === SECRET_HASH);
        window.addEventListener("hashchange", function () {
            if (location.hash === SECRET_HASH) {
                shuffle(true);
            }
        });
    </script>
</body>
</html>
